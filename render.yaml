# ═══════════════════════════════════════════════════════════════════════════
#  NEXHIRE AI — Render Infrastructure as Code (render.yaml)
#  Connects both Frontend & Backend to the same GitHub repository.
#  Every push to the main branch automatically triggers build & deployment.
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Backend Service (Spring Boot 3.3.4 / Java 21 / Docker) ──────────────────
  - type: web
    name: nexhire-backend
    runtime: docker
    region: oregon
    plan: standard
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_MIN
        value: 15
      - key: JWT_REFRESH_TTL_DAYS
        value: 30
      - key: JWT_ISSUER
        value: nexhire-ai
      - key: JWT_AUDIENCE
        value: nexhire-web
      - key: ORACLE_JDBC_URL
        sync: false
      - key: ORACLE_USERNAME
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PUBLIC_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_REGION
        value: us-east-1
      - key: MINIO_BUCKET_RESUMES
        value: nexhire-resumes
      - key: MINIO_BUCKET_AVATARS
        value: nexhire-avatars
      - key: MINIO_BUCKET_EXPORTS
        value: nexhire-exports
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "{baseUrl}/login/oauth2/code/{registrationId}"
      - key: BACKEND_CORS_ALLOWED_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  # ── Frontend Service (Next.js 15 / Node.js 20) ────────────────────────────
  - type: web
    name: nexhire-frontend
    runtime: node
    region: oregon
    plan: standard
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_NAME
        value: NEXHIRE AI
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
