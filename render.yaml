# ═══════════════════════════════════════════════════════════════════════════
#  NEXHIRE AI — Render Infrastructure as Code (render.yaml)
#  Frontend Service Deployment on Render (Node.js 20 / Next.js 15)
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Frontend Service (Next.js 15 / Node.js 20) ────────────────────────────
  - type: web
    name: nexhire-frontend
    runtime: node
    region: oregon
    plan: standard
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_NAME
        value: NEXHIRE AI
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: Backend Service (Spring Boot) Environment Variables Reference
# If deploying backend as a web service, set the following environment variables:
#
#   PORT=8080
#   SPRING_PROFILES_ACTIVE=prod
#   JWT_SECRET=<64-character-secret>
#   JWT_ACCESS_TTL_MIN=15
#   JWT_REFRESH_TTL_DAYS=30
#   JWT_ISSUER=nexhire-ai
#   JWT_AUDIENCE=nexhire-web
#   ORACLE_JDBC_URL=jdbc:oracle:thin:@//<host>:<port>/<service>
#   ORACLE_USERNAME=<username>
#   ORACLE_PASSWORD=<password>
#   REDIS_HOST=<redis-host>
#   REDIS_PORT=6379
#   REDIS_PASSWORD=<redis-password>
#   MINIO_ENDPOINT=<minio-or-s3-endpoint>
#   MINIO_PUBLIC_ENDPOINT=<public-endpoint>
#   MINIO_ACCESS_KEY=<access-key>
#   MINIO_SECRET_KEY=<secret-key>
#   MINIO_REGION=us-east-1
#   MINIO_BUCKET_RESUMES=nexhire-resumes
#   MINIO_BUCKET_AVATARS=nexhire-avatars
#   MINIO_BUCKET_EXPORTS=nexhire-exports
#   GOOGLE_CLIENT_ID=<google-client-id>
#   GOOGLE_CLIENT_SECRET=<google-client-secret>
#   GOOGLE_REDIRECT_URI={baseUrl}/login/oauth2/code/{registrationId}
#   BACKEND_CORS_ALLOWED_ORIGINS=https://nexhire-frontend.onrender.com
#   NEXT_PUBLIC_APP_URL=https://nexhire-frontend.onrender.com
# ─────────────────────────────────────────────────────────────────────────────
