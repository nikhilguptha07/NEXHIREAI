# ═══════════════════════════════════════════════════════════════════════════
#  NEXHIRE AI — Render Infrastructure as Code (render.yaml)
#  Automated CI/CD Blueprint for Full-Stack Deployment
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Backend Service (Spring Boot 3.3.4 / Java 21) ───────────────────────────
  - type: web
    name: nexhireai-backend
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: BACKEND_CORS_ALLOWED_ORIGINS
        value: https://nexhireai-frontend.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://nexhireai-frontend.onrender.com

  # ── Frontend Service (Next.js 15 / Node.js 20) ────────────────────────────
  - type: web
    name: nexhireai-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_NAME
        value: NEXHIRE AI
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://nexhireai-backend.onrender.com/api
      - key: NEXT_PUBLIC_APP_URL
        value: https://nexhireai-frontend.onrender.com
