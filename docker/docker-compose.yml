version: '3.8'

services:
  # ── Oracle Database 21c XE ────────────────────────────────────────────────
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: nexhire-oracle
    environment:
      - ORACLE_PASSWORD=system
      - APP_USER=system
      - APP_USER_PASSWORD=system
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

  # ── Redis (Cache & Rate Limiting) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexhire-redis
    ports:
      - "6379:6379"

  # ── MinIO (S3-Compatible Storage) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexhire-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=nexhire-app
      - MINIO_ROOT_PASSWORD=nexhire-app-secret-key-32-chars-min
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  oracle_data:
  minio_data:
