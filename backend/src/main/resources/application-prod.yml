server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: nexhire-backend-prod
  profiles:
    active: prod

  datasource:
    url: ${ORACLE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}}
    username: ${ORACLE_USERNAME:${SPRING_DATASOURCE_USERNAME:nexhire_prod}}
    password: ${ORACLE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:secret}}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

nexhire:
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://nexhireai.com}}
  security:
    jwt:
      secret: ${JWT_SECRET:nexhire-super-secure-production-ready-jwt-secret-key-at-least-64-bytes-long-for-hmac-sha512}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
      issuer: ${JWT_ISSUER:nexhire-ai}
      audience: ${JWT_AUDIENCE:nexhire-web}
  rate-limit:
    enabled: true
    capacity: 100
    refill-per-minute: 100
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:nexhire-app}
    secret-key: ${MINIO_SECRET_KEY:nexhire-app-secret-key-32-chars-min}
    region: ${MINIO_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    ai.nexhire: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
