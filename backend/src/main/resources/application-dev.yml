# ═══════════════════════════════════════════════════════════════════════════
#  NEXHIRE AI — Development profile
#  - Verbose SQL logging, Banner, auto-DDL disabled (use Flyway-style scripts)
#  - Permissive CORS for the local frontend
# ═══════════════════════════════════════════════════════════════════════════
spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_boolean_type: numeric

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

nexhire:
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: false

logging:
  level:
    ai.nexhire: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  swagger-ui:
    enabled: true
